[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "co-column-reconstruction"
version = "0.1.0"
description = "Reproducible CO total-column reconstruction and multi-satellite validation pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "BSD-3-Clause"
authors = [
  { name = "Douglas Lima de Bem" },
  { name = "Luiz Angelo Steffenel" },
  { name = "El Hassan Bencherif" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "xarray>=2024.1",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "netCDF4>=1.6,<2",
  "h5py>=3.10,<4",
  "requests>=2.31,<3",
  "cdsapi>=0.7,<1",
  "matplotlib>=3.8,<4",
  "cartopy>=0.22,<1",
  "scikit-image>=0.22,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
workflow = ["snakemake>=8,<9"]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
co-pipeline = "co_pipeline.cli:main"

[project.urls]
Repository = "https://github.com/YasoUwU/co-column-reconstruction"

[tool.hatch.build.targets.wheel]
packages = ["src/co_pipeline"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["co_pipeline"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
