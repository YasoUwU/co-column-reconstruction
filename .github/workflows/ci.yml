name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest --cov=co_pipeline --cov-report=term-missing
      - name: Build package
        run: python -m build
      - name: Repository safety audit
        run: python tools/security_audit.py .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-dry-run:
    runs-on: ubuntu-latest
    env:
      CO_DATA_ROOT: ${{ github.workspace }}/.ci-data
      CO_OUTPUT_ROOT: ${{ github.workspace }}/.ci-output
      CO_CACHE_ROOT: ${{ github.workspace }}/.ci-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install workflow dependencies
        run: python -m pip install -e ".[workflow]"
      - name: Validate workflow graph without data or network
        run: snakemake -s workflows/Snakefile --configfile configs/example.yaml --cores 1 --dry-run
